services:
  backend:
    build:
      context: .
      dockerfile: backend-rs/Dockerfile
    container_name: autobbq-backend
    ports:
      - "4000:4000"
    environment:
      STORAGE_DIR: /app/storage
      DATABASE_URL: sqlite:/app/storage/data/autobbq.sqlite
    volumes:
      - ./storage:/app/storage

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000}
    container_name: autobbq-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000}
    depends_on:
      - backend
